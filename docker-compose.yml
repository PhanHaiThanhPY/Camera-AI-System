services:
  postgres:
    image: postgres:16-alpine
    container_name: camera-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: camera_ai
      POSTGRES_PASSWORD: camera_ai
      POSTGRES_DB: camera_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camera_ai -d camera_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lưu ảnh bằng chứng (frame xe/biển số) do python/detect chụp và upload — xem python/detect/storage.py.
  # Console quản trị (xem bucket, xoá ảnh cũ...) tại http://localhost:9001.
  # Ảnh minio/minio chính chủ đã bị gỡ khỏi Docker Hub (và quay.io cũng chặn pull ẩn danh từ cuối
  # 2025) — dùng bản build của Chainguard, image tối giản không có shell/curl nên không cần/không
  # dùng được healthcheck kiểu CMD-SHELL thông thường.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: camera-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-camera_ai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-camera_ai_minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
