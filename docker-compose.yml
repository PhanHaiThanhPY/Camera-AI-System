services:
  postgres:
    image: postgres:16-alpine
    container_name: camera-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: camera_ai
      POSTGRES_PASSWORD: camera_ai
      POSTGRES_DB: camera_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camera_ai -d camera_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
